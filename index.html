<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Dog's Dream</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #ffffff;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* ════════════════════════════════
       首页 · 分层布局（从底到顶）
    ════════════════════════════════ */
    #home-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      transition: opacity 1.4s ease;
    }

    #home-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* 层1: 背景图 */
    #bg-image {
      position: absolute;
      top: -190px;
      left: 0;
      width: 100%;
      height: calc(100% + 240px);
      object-fit: cover;
      z-index: 1;
    }

    /* 层2: 坐垫 */
    #cushion {
      position: absolute;
      bottom: calc(10% + 20px + 40px + 50px);
      left: 50%;
      transform: translateX(-50%) scaleY(1.0);
      width: 409px;
      height: auto;
      z-index: 2;
    }

    /* 层3: Three.js 狗狗画布 */
    #dog-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    /* 层4a: 梦泡 */
    #dream-bubble {
      position: absolute;
      left: calc(50% - 17vw - 300px + 500px + 100px + 100px + 10px + 10px - 400px - 350px + 200px);
      top: calc(20% + 500px - 300px + 20px);
      width: clamp(198px, 29vw, 440px);
      filter: contrast(1.1) brightness(1.05);
      height: auto;
      z-index: 5;
      cursor: pointer;
      opacity: 0;
      pointer-events: all;
    }

    #dream-bubble.visible { opacity: 1; }

    #dream-bubble.breathing {
      animation: bubbleFloat 4s ease-in-out infinite;
    }

    @keyframes bubbleFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-8px) scale(1.05); }
    }

    #dream-bubble:hover {
      /* 无阴影 */
    }

    /* 梦泡破裂碎片容器 */
    #bubble-shards {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    .shard {
      position: fixed;
      background-size: cover;
      background-repeat: no-repeat;
      border-radius: 2px;
      z-index: 100;
      pointer-events: none;
    }

    @keyframes shardFly {
      0% {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.3);
      }
    }

    /* 层4b: 文字 */
    #text-image {
      position: absolute;
      top: calc(8% + 50px);
      left: 50%;
      transform: translateX(-50%) scale(1.44);
      width: clamp(300px, 50vw, 800px);
      height: auto;
      z-index: 5;
      opacity: 0;
      animation: fadeInOpacity 2s ease 1s forwards;
    }

    @keyframes fadeInOpacity {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-50%) translateY(10px) scale(1.69); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.69); }
    }

    /* 加载提示 */
    #loading-hint {
      position: absolute;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 0.15em;
      color: #ccc;
      z-index: 6;
      transition: opacity 0.8s ease;
    }

    #loading-hint.hidden { opacity: 0; }

    /* ════════════════════════════════
       走廊
    ════════════════════════════════ */
    #gallery-screen {
      position: fixed;
      inset: 0;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.4s ease;
    }

    #gallery-screen.visible {
      opacity: 1;
      pointer-events: all;
    }

    #gallery-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #wake-btn {
      position: fixed;
      bottom: 32px;
      right: 40px;
      z-index: 20;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #c0c0c0;
      cursor: pointer;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.6s ease, color 0.3s ease;
      pointer-events: none;
      background: none;
      border: none;
      font-family: inherit;
    }

    #wake-btn.visible {
      opacity: 1;
      pointer-events: all;
    }

    #wake-btn:hover { color: #888; }

    #sleep-btn {
      position: fixed;
      bottom: calc(15% - 50px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: #999;
      cursor: pointer;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.8s ease, color 0.3s ease;
      pointer-events: none;
      background: none;
      border: 1px solid #ccc;
      border-radius: 20px;
      padding: 8px 24px;
      font-family: inherit;
    }

    #sleep-btn.visible {
      opacity: 1;
      pointer-events: all;
    }

    #sleep-btn:hover { color: #555; }

    /* ════════════════════════════════
       画框简介面板
    ════════════════════════════════ */
    #info-panel {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    #info-panel.on-left  { left: 5%; }
    #info-panel.on-right { right: 5%; }

    #info-panel.visible {
      opacity: 1;
      pointer-events: all;
    }

    #info-title {
      font-size: 13px;
      letter-spacing: 0.15em;
      color: #666;
      margin-bottom: 8px;
      font-weight: 500;
    }

    #info-desc {
      font-size: 11px;
      line-height: 1.8;
      color: #999;
      margin-bottom: 20px;
      max-width: 260px;
    }

    #info-btn-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    #info-enter-btn {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #888;
      cursor: pointer;
      text-transform: uppercase;
      background: none;
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 10px 28px;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    #info-enter-btn:hover {
      color: #555;
      border-color: #aaa;
    }

    #info-btn-group {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    #info-enter-btn,
    #info-back-btn {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #888;
      cursor: pointer;
      text-transform: uppercase;
      background: none;
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 10px 28px;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    #info-enter-btn:hover,
    #info-back-btn:hover {
      color: #555;
      border-color: #aaa;
    }
  </style>
</head>
<body>

  <div id="home-screen">
    <img id="bg-image" src="./assets/底层-背景.jpg" alt="background" />
    <img id="cushion" src="./assets/坐垫.png" alt="cushion" />
    <canvas id="dog-canvas"></canvas>
    <img id="dream-bubble" class="breathing" src="./assets/梦泡.png" alt="dream bubble" />
    <img id="text-image" src="./assets/文字.png" alt="text" />
    <div id="loading-hint">loading dream...</div>
  </div>

  <div id="bubble-shards"></div>

  <div id="gallery-screen">
    <canvas id="gallery-canvas"></canvas>
  </div>

  <button id="wake-btn">· wake up ·</button>
  <button id="sleep-btn">· sleep ·</button>

  <!-- 画框简介面板 -->
  <div id="info-panel">
    <div id="info-title">Work 01</div>
    <div id="info-desc">简介内容待填写...</div>
    <div id="info-btn-group">
      <button id="info-enter-btn">进入深梦</button>
      <button id="info-back-btn">← 返回画廊</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { AnimationMixer } from 'three';

    const dogCanvas = document.getElementById('dog-canvas');
    const homeScreen = document.getElementById('home-screen');
    const dreamBubble = document.getElementById('dream-bubble');
    const loadingHint = document.getElementById('loading-hint');
    const wakeBtn = document.getElementById('wake-btn');
    const sleepBtn = document.getElementById('sleep-btn');

    const renderer = new THREE.WebGLRenderer({
      canvas: dogCanvas,
      antialias: true,
      alpha: true
    });
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 5);
    camera.lookAt(0, 0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 2.0));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
    dirLight.position.set(3, 6, 4);
    scene.add(dirLight);
    const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
    fillLight.position.set(-3, 2, -2);
    scene.add(fillLight);

    let dogMixer = null;
    let dogModel = null;
    let dogBaseY = 0;
    let dogScale = 1.0;
    const loader = new GLTFLoader();

    loader.load('./assets/puppy.glb', (gltf) => {
      dogModel = gltf.scene;

      const box = new THREE.Box3().setFromObject(dogModel);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 1.37 / maxDim;
      dogScale = scale * 0.7;
      dogModel.scale.setScalar(dogScale);
      dogModel.position.sub(center.multiplyScalar(scale));
      dogModel.position.x = 0;
      dogModel.position.y += size.y * scale * 0.5 - 1.28;
      dogBaseY = dogModel.position.y;

      dogModel.rotation.y = -1.38;
      dogModel.rotation.z = 0.2;

      dogModel.traverse(child => {
        if (child.isMesh) {
          if (child.material.map) {
            child.material.color.set(0xffffff);
            child.material.needsUpdate = true;
          } else {
            child.material = new THREE.MeshStandardMaterial({
              color: 0xffffff,
              roughness: 0.9,
              metalness: 0.0,
            });
          }
        }
      });

      scene.add(dogModel);

      if (gltf.animations && gltf.animations.length > 0) {
        dogMixer = new THREE.AnimationMixer(dogModel);
        dogMixer.clipAction(gltf.animations[0]).play();
      }

      loadingHint.classList.add('hidden');
      setTimeout(() => dreamBubble.classList.add('visible'), 800);

    }, (progress) => {
      if (progress.total > 0) {
        const pct = Math.round(progress.loaded / progress.total * 100);
        loadingHint.textContent = 'loading dream... ' + pct + '%';
      }
    }, (err) => {
      console.error('狗狗加载失败:', err);
      loadingHint.textContent = 'model load failed';
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      if (dogMixer) dogMixer.update(delta);
      if (dogModel) {
        const breathe = Math.sin(elapsed * 0.785);
        dogModel.position.y = dogBaseY + breathe * 0.003;
        // 梦泡同步浮动（只有上下，不缩放）
        dreamBubble.style.transform = `translateY(${breathe * 4}px)`;
      }

      renderer.render(scene, camera);
    }
    animate();

    /* 梦泡破裂效果 */
    function bubbleShatter() {
      const bubble = document.getElementById('dream-bubble');
      const bubbleRect = bubble.getBoundingClientRect();
      const bubbleCenterX = bubbleRect.left + bubbleRect.width / 2;
      const bubbleCenterY = bubbleRect.top + bubbleRect.height / 2;

      // 创建碎片（用梦泡图片作为碎片背景）
      const shardCount = 16;
      for (let i = 0; i < shardCount; i++) {
        const shard = document.createElement('div');
        shard.className = 'shard';
        shard.style.backgroundImage = "url('./assets/梦泡.png')";
        shard.style.backgroundSize = 'cover';

        // 碎片大小随机
        const size = 20 + Math.random() * 40;
        shard.style.width = size + 'px';
        shard.style.height = size + 'px';

        // 碎片初始位置（在泡泡中心附近随机分布）
        const offsetX = (Math.random() - 0.5) * bubbleRect.width;
        const offsetY = (Math.random() - 0.5) * bubbleRect.height;
        shard.style.left = (bubbleCenterX + offsetX - size / 2) + 'px';
        shard.style.top = (bubbleCenterY + offsetY - size / 2) + 'px';

        // 背景定位（让每个碎片显示梦泡的不同部分）
        shard.style.backgroundPosition = `${(Math.random() * 100)}% ${(Math.random() * 100)}%`;

        // 飞散方向（从中心向外）
        const angle = Math.random() * Math.PI * 2;
        const tx = Math.cos(angle) * (100 + Math.random() * 150);
        const ty = Math.sin(angle) * (100 + Math.random() * 150) - 50; // 向上偏
        const rot = (Math.random() - 0.5) * 720;
        shard.style.setProperty('--tx', tx + 'px');
        shard.style.setProperty('--ty', ty + 'px');
        shard.style.setProperty('--rot', rot + 'deg');
        shard.style.opacity = '0';

        document.body.appendChild(shard);

        // 延迟出现
        setTimeout(() => {
          shard.style.transition = 'opacity 0.05s';
          shard.style.opacity = '1';
          shard.style.animation = 'shardFly 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards';
        }, 30 + i * 20);

        // 动画结束后移除
        setTimeout(() => {
          shard.style.opacity = '0';
          setTimeout(() => shard.remove(), 200);
        }, 800 + i * 30);
      }

      // 立即隐藏原始梦泡（先去掉 transition 避免延迟）
      bubble.style.transition = 'none';
      bubble.style.opacity = '0';
      bubble.style.pointerEvents = 'none'; // 禁用点击
      // 0.8秒后恢复 transition（为下次显示做准备）
      setTimeout(() => {
        bubble.style.transition = 'opacity 1.5s ease';
      }, 800);
    }

    /* 点击梦泡 → 走廊 */
    dreamBubble.addEventListener('click', enterDream);

    function enterDream() {
      // 移除 fade-out 类，强制允许点击
      homeScreen.style.opacity = '0';
      homeScreen.style.pointerEvents = 'none';
      setTimeout(() => {
        document.getElementById('gallery-screen').classList.add('visible');
        wakeBtn.classList.add('visible');
        initGallery();
      }, 100);
    }

    /* 醒过来 */
    wakeBtn.addEventListener('click', () => {
      document.getElementById('gallery-screen').classList.remove('visible');
      wakeBtn.classList.remove('visible');
      homeScreen.style.transition = 'opacity 1.4s ease';
      homeScreen.style.opacity = '1';
      homeScreen.style.pointerEvents = 'auto';
      // 延迟 0.5 秒后梦泡破裂
      setTimeout(bubbleShatter, 500);
      // 破裂动画结束后，显示 sleep 按钮
      setTimeout(() => {
        sleepBtn.classList.add('visible');
      }, 500 + 1000);
    });

    /* 睡觉 */
    sleepBtn.addEventListener('click', () => {
      sleepBtn.classList.remove('visible');
      dreamBubble.style.transition = 'opacity 1.5s ease';
      dreamBubble.style.opacity = '1';
      dreamBubble.style.pointerEvents = 'auto'; // 恢复点击
    });

    /* 走廊 */
    let galleryInited = false;

    function initGallery() {
      if (galleryInited) return;
      galleryInited = true;

      const galCanvas = document.getElementById('gallery-canvas');
      const galRenderer = new THREE.WebGLRenderer({ canvas: galCanvas, antialias: true });
      galRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      galRenderer.setSize(window.innerWidth, window.innerHeight);
      galRenderer.outputColorSpace = THREE.SRGBColorSpace;

      const galScene = new THREE.Scene();
      galScene.background = new THREE.Color(0xfafafa);
      galScene.fog = new THREE.Fog(0xfafafa, 12, 50);

      const galCamera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 60);
      galCamera.position.set(0, 1.5, 0);

      galScene.add(new THREE.AmbientLight(0xffffff, 2.3));
      const galDir = new THREE.DirectionalLight(0xffffff, 1.0);
      galDir.position.set(0, 6, -5);
      galScene.add(galDir);

      const floorGeo = new THREE.PlaneGeometry(6, 80);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 1 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.z = -40;
      galScene.add(floor);

      const ceilGeo = new THREE.PlaneGeometry(6, 80);
      const ceilMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 });
      const ceil = new THREE.Mesh(ceilGeo, ceilMat);
      ceil.rotation.x = Math.PI / 2;
      ceil.position.set(0, 3, -40);
      galScene.add(ceil);

      const wallGeo = new THREE.PlaneGeometry(80, 3);
      const wallMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 1 });
      const leftWall = new THREE.Mesh(wallGeo, wallMat.clone());
      leftWall.rotation.y = Math.PI / 2;
      leftWall.position.set(-3, 1.5, -40);
      galScene.add(leftWall);
      const rightWall = new THREE.Mesh(wallGeo, wallMat.clone());
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.position.set(3, 1.5, -40);
      galScene.add(rightWall);

      const works = [
        { z: -4.5, side: 'left',  title: 'Work 01', scale: 1.6, yOffset: 0.15,  rotZ: 0.04,  desc: '' },
        { z: -5.0, side: 'right', title: 'Work 02', scale: 1.4, yOffset: -0.1,  rotZ: -0.03, desc: '' },
        { z: -8.3, side: 'left',  title: 'Work 03', scale: 1.3, yOffset: 0.2,   rotZ: 0.05,  desc: '' },
        { z: -11.0, side: 'right', title: 'Work 04', scale: 1.2, yOffset: -0.15, rotZ: -0.04, desc: '' },
        { z: -12.1, side: 'left',  title: 'Work 05', scale: 1.1, yOffset: 0.05,  rotZ: 0.02,  desc: '' },
        { z: -17.0, side: 'right', title: 'Work 06', scale: 1.0, yOffset: -0.2,  rotZ: -0.06, desc: '' },
        { z: -15.9, side: 'left',  title: 'Work 07', scale: 1.3, yOffset: 0.15,  rotZ: 0.04,  desc: '' },
        { z: -23.0, side: 'right', title: 'Work 08', scale: 1.2, yOffset: -0.1,  rotZ: -0.03, desc: '' },
        { z: -19.7, side: 'left',  title: 'Work 09', scale: 1.1, yOffset: 0.2,   rotZ: 0.05,  desc: '' },
        { z: -29.0, side: 'right', title: 'Work 10', scale: 1.0, yOffset: -0.15, rotZ: -0.04, desc: '' },
        { z: -23.5, side: 'left',  title: 'Work 11', scale: 1.3, yOffset: 0.15,  rotZ: 0.04,  desc: '' },
        { z: -35.0, side: 'right', title: 'Work 12', scale: 1.2, yOffset: -0.1,  rotZ: -0.03, desc: '' },
        { z: -27.3, side: 'left',  title: 'Work 13', scale: 1.1, yOffset: 0.2,   rotZ: 0.05,  desc: '' },
        { z: -41.0, side: 'right', title: 'Work 14', scale: 1.0, yOffset: -0.15, rotZ: -0.04, desc: '' },
      ];
      const frames = [];
      const baseScale = 1.0; // 统一基础缩放
      const texLoader = new THREE.TextureLoader();
      
      // 先加载图片，等加载完成后再创建画框
      texLoader.load(
        './assets/01框.jpg',
        (tex01) => {
          tex01.colorSpace = THREE.SRGBColorSpace;
          
          works.forEach((w, i) => {
            const baseW = 0.8, baseH = 1.1, baseD = 0.04;
            const fGeo = new THREE.BoxGeometry(baseW * baseScale, baseH * baseScale, baseD);
            // 不同面用不同颜色（亮面 vs 暗面）
            const mats = [
              new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 }),
              new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 }),
              new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 }),
              new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 }),
              new THREE.MeshStandardMaterial({ map: i === 0 ? tex01 : null, roughness: 0.1, emissive: 0xffffff, emissiveIntensity: 0.15 }),
              new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 }),
            ];
            const frame = new THREE.Mesh(fGeo, mats);
            frame.position.set(w.side === 'left' ? -3 : 3, 1.5 + w.yOffset, w.z);
            frame.rotation.z = w.rotZ;
            frame.rotation.y = w.side === 'left' ? Math.PI / 2 : -Math.PI / 2;
            frame.userData = { baseZ: w.z, baseScale: w.scale };
            galScene.add(frame);
            frames.push(frame);
          });
        },
        undefined,
        (err) => { 
          console.warn('图片加载失败:', err);
          // 即使加载失败也创建纯白画框
          works.forEach((w, i) => {
            const baseW = 0.8, baseH = 1.1, baseD = 0.04;
            const fGeo = new THREE.BoxGeometry(baseW * baseScale, baseH * baseScale, baseD);
            const mats = [
              new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 }),
              new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 }),
              new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 }),
              new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 }),
              new THREE.MeshStandardMaterial({ roughness: 0.3 }),
              new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 }),
            ];
            const frame = new THREE.Mesh(fGeo, mats);
            frame.position.set(w.side === 'left' ? -3 : 3, 1.5 + w.yOffset, w.z);
            frame.rotation.z = w.rotZ;
            frame.rotation.y = w.side === 'left' ? Math.PI / 2 : -Math.PI / 2;
            frame.userData = { baseZ: w.z, baseScale: w.scale };
            galScene.add(frame);
            frames.push(frame);
          });
        }
      );

      let targetZ = 0, currentZ = 0;
      let isFocusMode = false;
      let focusTarget = null;
      let originalTargetZ = 0;

      // 简介面板元素
      const infoPanel = document.getElementById('info-panel');
      const infoTitle = document.getElementById('info-title');
      const infoDesc = document.getElementById('info-desc');
      const infoEnterBtn = document.getElementById('info-enter-btn');
      const infoBackBtn = document.getElementById('info-back-btn');

      // Raycaster 用于点击检测
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      window.addEventListener('wheel', (e) => {
        if (isFocusMode) return; // 聚焦模式下禁止滚动
        targetZ = Math.max(-48, Math.min(0, targetZ - e.deltaY * 0.012));
      });

      // 点击画框
      galCanvas.addEventListener('click', (e) => {
        if (isFocusMode) return;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, galCamera);
        const intersects = raycaster.intersectObjects(frames);

        if (intersects.length > 0) {
          const frame = intersects[0].object;
          const workIndex = frames.indexOf(frame);
          const work = works[workIndex];

          // 进入聚焦模式
          isFocusMode = true;
          focusTarget = frame;
          originalTargetZ = targetZ;

          // 聚焦模式：相机在走廊中央，面向画框
          const camX = 0;
          const camY = 1.5 + work.yOffset;
          const camZ = work.z;
          galCamera.position.set(camX, camY, camZ);
          // 看往画框（画框正面朝向相机）
          galCamera.lookAt(work.side === 'left' ? -10 : 10, camY, camZ);

          // 显示简介面板（固定在右侧）
          infoTitle.textContent = work.title;
          infoDesc.textContent = work.desc || '简介内容待填写...';
          infoPanel.classList.remove('on-left', 'on-right');
          infoPanel.classList.add('on-right');
          infoPanel.classList.add('visible');

          // 聚焦时禁止滚动，但不改变相机Z位置
          targetZ = galCamera.position.z;
          currentZ = galCamera.position.z;
        }
      });

      // 返回画廊
      infoBackBtn.addEventListener('click', () => {
        isFocusMode = false;
        focusTarget = null;

        // 隐藏简介面板
        infoPanel.classList.remove('visible', 'on-left', 'on-right');

        // 恢复相机位置
        targetZ = originalTargetZ;
        galCamera.position.set(0, 1.5, currentZ);
        galCamera.rotation.set(0, 0, 0);
      });

      // 进入详情页（暂时提示）
      infoEnterBtn.addEventListener('click', () => {
        alert('进入作品详情页 - 待实现');
      });

      const galClock = new THREE.Clock();
      function animateGallery() {
        requestAnimationFrame(animateGallery);
        const t = galClock.getElapsedTime();

        // 只有非聚焦模式才平滑移动
        if (!isFocusMode) {
          currentZ += (targetZ - currentZ) * 0.06;
        }
        galCamera.position.z = currentZ;

        frames.forEach((f, i) => {
          // 漂浮动画
          f.position.y = 1.5 + Math.sin(t * 0.6 + i * 1.5) * 0.08;
          // 所有画框保持原始大小
          f.scale.set(f.userData.baseScale, f.userData.baseScale, 1);
        });
        galRenderer.render(galScene, galCamera);
      }
      animateGallery();
    }

    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });
  </script>
</body>
</html>
